zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: eb327d7746314d7eb80c6a951435cd00
    name: Templates/Power
  templates:
  - uuid: eb9851170d614754903e231093437956
    template: VERTIV by SNMP
    name: VERTIV by SNMP
    description: 'VERTIV by SNMP


      Read-only Zabbix template for monitoring Vertiv/Liebert UPS systems by SNMP.


      Monitoring model:

      - RFC 1628 UPS-MIB (1.3.6.1.2.1.33) for standardized UPS measurements.

      - Vertiv/Liebert enterprise MIB (1.3.6.1.4.1.476.1.42) for vendor-specific status and metrics.

      - Dynamic discovery of input, output and bypass lines/phases.

      - Configurable trigger thresholds through user macros.

      - No reboot, shutdown, outlet-control or other write OIDs are included.


      Project: https://github.com/kmansur/zabbix-vertiv-ups-snmp

      Reference template: https://github.com/Mihguel-Araujo/Template-Zabbix/blob/main/Template%20Vertiv

      Original reference author: Mihguel da Silva Santos Tavares de Araujo.

      Maintained and substantially rewritten by Karim Mansur / Net Tech.


      License: MIT for the original work in this repository. See LICENSE and NOTICE.md for attribution
      and third-party licensing notes.


      Important: Vertiv enterprise OID scaling and availability can vary by UPS model/management card. Validate values against the UPS LCD/web
      interface after import.


      Export target: Zabbix 7.0.'
    groups:
    - name: Templates/Power
    items:
    - uuid: 0acbe36282c64d0cbeef535d47bcab41
