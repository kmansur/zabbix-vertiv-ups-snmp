    discovery_rules:
    - uuid: 892ca15e79f943fca1a69373351353c9
      name: UPS input lines discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#UPSINPUTVOLTAGE},1.3.6.1.2.1.33.1.3.3.1.3]
      key: ups.input.lines.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      item_prototypes:
      - uuid: 3473e8fe048e4d729cacf9b2e01531a6
        name: 'UPS: Input line {#SNMPINDEX}: Frequency'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.2.{#SNMPINDEX}
        key: ups.input.frequency[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        value_type: FLOAT
        units: Hz
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
        tags:
        - tag: component
          value: input
      - uuid: 86b13312b27d4c969b5ddba890731f64
        name: 'UPS: Input line {#SNMPINDEX}: Voltage'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.3.{#SNMPINDEX}
        key: ups.input.voltage[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: V
        tags:
        - tag: component
          value: input
      - uuid: d02b734d419c49b0832f7c217ce71333
        name: 'UPS: Input line {#SNMPINDEX}: Current'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.4.{#SNMPINDEX}
        key: ups.input.current[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        value_type: FLOAT
        units: A
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
        tags:
        - tag: component
          value: input
      - uuid: ee3e9a74c6da4614b6c2255056d436c6
        name: 'UPS: Input line {#SNMPINDEX}: True power'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.5.{#SNMPINDEX}
        key: ups.input.power[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: W
        tags:
        - tag: component
          value: input
      lifetime_type: DELETE_AFTER
      enabled_lifetime: 1d
      description: Discovers UPS input lines/phases exposed by RFC1628 UPS-MIB.
    - uuid: d31c34932938414ba1b078d32f0deeca
      name: UPS output lines discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#UPSOUTPUTVOLTAGE},1.3.6.1.2.1.33.1.4.4.1.2]
      key: ups.output.lines.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      item_prototypes:
      - uuid: 183e5b6c30524472a5de53980c14679b
        name: 'UPS: Output line {#SNMPINDEX}: Voltage'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.2.{#SNMPINDEX}
        key: ups.output.voltage[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: V
        tags:
        - tag: component
          value: output
      - uuid: af101cd684f544d2888d1d2cc90b37ef
        name: 'UPS: Output line {#SNMPINDEX}: Current'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.3.{#SNMPINDEX}
        key: ups.output.current[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        value_type: FLOAT
        units: A
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
        tags:
        - tag: component
          value: output
      - uuid: c47c0f80ce3449a18a1fd273619c259c
        name: 'UPS: Output line {#SNMPINDEX}: Power'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.4.{#SNMPINDEX}
        key: ups.output.power[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: W
        tags:
        - tag: component
          value: output
      - uuid: a1aae8428cc344b397c0944b6f79b948
        name: 'UPS: Output line {#SNMPINDEX}: Load'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.5.{#SNMPINDEX}
        key: ups.output.load[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: '%'
        tags:
        - tag: component
          value: output
        trigger_prototypes:
        - uuid: 3ed3a4a8a4a840109e3445ab1b13b6cc
          expression: last(/VERTIV by SNMP/ups.output.load[{#SNMPINDEX}])>={$UPS.LOAD.WARN} and last(/VERTIV by SNMP/ups.output.load[{#SNMPINDEX}])<{$UPS.LOAD.CRIT}
          name: UPS output line {#SNMPINDEX} load is high on {HOST.NAME}
          priority: WARNING
          opdata: 'Line {#SNMPINDEX} load: {ITEM.LASTVALUE1} %'
        - uuid: d450a36c1b9349a78f85bdf8af12e00b
          expression: last(/VERTIV by SNMP/ups.output.load[{#SNMPINDEX}])>={$UPS.LOAD.CRIT}
          name: UPS output line {#SNMPINDEX} load is critically high on {HOST.NAME}
          priority: HIGH
          opdata: 'Line {#SNMPINDEX} load: {ITEM.LASTVALUE1} %'
      lifetime_type: DELETE_AFTER
      enabled_lifetime: 1d
      description: Discovers UPS output lines/phases exposed by RFC1628 UPS-MIB.
    - uuid: 8c7176ea7cd74dcf9df4cb4dea616e81
      name: UPS bypass lines discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#UPSBYPASSVOLTAGE},1.3.6.1.2.1.33.1.5.3.1.2]
      key: ups.bypass.lines.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      item_prototypes:
      - uuid: a3fc8a5532284ced9cdceacdca4c7a72
        name: 'UPS: Bypass line {#SNMPINDEX}: Voltage'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.5.3.1.2.{#SNMPINDEX}
        key: ups.bypass.voltage[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: V
        tags:
        - tag: component
          value: bypass
      lifetime_type: DELETE_AFTER
      enabled_lifetime: 1d
      description: Discovers UPS bypass lines/phases exposed by RFC1628 UPS-MIB.
    macros:
    - macro: '{$UPS.RUNTIME.WARN}'
      value: '10'
      description: Battery runtime warning threshold, minutes.
    - macro: '{$UPS.RUNTIME.CRIT}'
      value: '5'
      description: Battery runtime critical threshold, minutes.
    - macro: '{$UPS.BATTERY.CHARGE.WARN}'
      value: '40'
      description: Battery charge warning threshold, percent. Applied while UPS is on battery.
    - macro: '{$UPS.BATTERY.CHARGE.CRIT}'
      value: '20'
      description: Battery charge critical threshold, percent. Applied while UPS is on battery.
    - macro: '{$UPS.LOAD.WARN}'
      value: '80'
      description: UPS load warning threshold, percent.
    - macro: '{$UPS.LOAD.CRIT}'
      value: '95'
      description: UPS load critical threshold, percent.
    - macro: '{$UPS.BATTERY.TEMP.WARN}'
      value: '35'
      description: Battery temperature warning threshold, degrees Celsius.
    - macro: '{$UPS.BATTERY.TEMP.CRIT}'
      value: '40'
      description: Battery temperature critical threshold, degrees Celsius.
    - macro: '{$UPS.INLET.TEMP.WARN}'
      value: '30'
      description: UPS inlet air temperature warning threshold, degrees Celsius.
    - macro: '{$UPS.INLET.TEMP.CRIT}'
      value: '35'
      description: UPS inlet air temperature critical threshold, degrees Celsius.
