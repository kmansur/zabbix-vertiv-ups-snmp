zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: eb327d7746314d7eb80c6a951435cd00
    name: Templates/Power
  templates:
  - uuid: eb9851170d614754903e231093437956
    template: VERTIV by SNMP
    name: Vertiv by SNMP
    description: 'Vertiv by SNMP


      Read-only Zabbix template for monitoring Vertiv/Liebert UPS systems by SNMP.


      Monitoring model:

      - RFC 1628 UPS-MIB (1.3.6.1.2.1.33) for standardized UPS measurements.

      - Vertiv/Liebert enterprise MIB (1.3.6.1.4.1.476.1.42) for vendor-specific status and metrics.

      - Dynamic discovery of input, output and bypass lines/phases.

      - Fixed electrical summary items for deterministic dashboards and troubleshooting.

      - Configurable trigger thresholds through user macros.

      - No reboot, shutdown, outlet-control or other write OIDs are included.


      Version 1.1.0 adds dashboard-ready fixed phase metrics for input, output and bypass, output frequency, per-phase power/current/power-factor metrics, battery cabinet/test-interval metadata, and calculated total input power.


      Project: https://github.com/kmansur/zabbix-vertiv-ups-snmp

      Reference template: https://github.com/Mihguel-Araujo/Template-Zabbix/blob/main/Template%20Vertiv

      Original reference author: Mihguel da Silva Santos Tavares de Araujo.

      Maintained and substantially rewritten by Karim Mansur / Net Tech.


      License: MIT for the original work in this repository. See LICENSE and NOTICE.md for attribution and third-party licensing notes.


      Important: the supplied Vertiv SNMP parameter list identifies enterprise metrics but does not define scaling for every private OID. Private electrical summary items therefore do not apply guessed multipliers. Validate values against the UPS LCD/web interface before relying on them for thresholds or dashboards.


      The supplied event/condition OID lists identify alarms but do not define the return-state encoding of the pollable .2.100.* objects. Event-specific polling triggers are intentionally not fabricated until live values are validated.


      Version 1.2.0 adds the native Vertiv UPS Overview dashboard with status, battery, electrical, bypass, environmental and trend views.


      Version 1.3.0 adds an optional generator for an importable Zabbix network-map synoptic view of a monitored Vertiv UPS host.


      Version 1.3.2 normalizes Vertiv private enumeration objects that some management cards return as textual SNMP strings instead of numeric enum values. The preprocessing accepts both textual and numeric representations so value maps and numeric trigger expressions remain portable.


      Version 1.3.3 refines dashboard typography for compact item-value cards, reducing value/unit font sizes and removing change indicators to avoid truncation.


      Version 1.4.0 finalizes severity-colored dashboard cards, keeps native value-map rendering for reliable status text, changes the visible template name to Vertiv by SNMP while preserving the technical identifier for in-place upgrades, and removes unvalidated private input-power values from prominent dashboard views.


      Export target: Zabbix 8.0.'
    vendor:
      name: Net Tech
      version: 1.4-0
    groups:
    - name: Templates/Power
