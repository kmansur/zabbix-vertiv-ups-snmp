    - uuid: 3e4c174fdf6542feb69c14c27f9c12c1
      name: 'UPS: Battery cabinet type'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.476.1.42.3.9.20.1.20.1.2.1.6183
      key: vertiv.battery.cabinet.type
      delay: 1h
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - '// VERTIV_ENUM_NORMALIZER

          var s = String(value).trim();

          if (/^-?\d+$/.test(s)) { return parseInt(s, 10); }

          var p = s.match(/\((-?\d+)\)\s*$/);

          if (p) { return parseInt(p[1], 10); }

          var k = s.toLowerCase().replace(/\s+/g, '' '');

          var map = {"external":1,"internal":0,"lrt":2};

          if (map[k] !== undefined) { return map[k]; }

          throw ''Unsupported Vertiv enum value for vertiv.battery.cabinet.type: '' + value;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      description: Vertiv battery cabinet type.
      tags:
      - tag: component
        value: battery
      valuemap:
        name: Vertiv battery cabinet type
    - uuid: 24b17d016cf0432ca7444a02b981026b
      name: 'UPS: Automatic battery test interval'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.476.1.42.3.9.20.1.20.1.2.1.5805
      key: vertiv.battery.test.interval
      delay: 1h
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - '// VERTIV_ENUM_NORMALIZER

          var s = String(value).trim();

          if (/^-?\d+$/.test(s)) { return parseInt(s, 10); }

          var p = s.match(/\((-?\d+)\)\s*$/);

          if (p) { return parseInt(p[1], 10); }

          var k = s.toLowerCase().replace(/\s+/g, '' '');

          var map = {"12 weeks":1,"16 weeks":2,"20 weeks":3,"26 weeks":4,"8 weeks":0};

          if (map[k] !== undefined) { return map[k]; }

          throw ''Unsupported Vertiv enum value for vertiv.battery.test.interval: '' + value;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      description: Configured automatic battery test interval as documented by the supplied Vertiv SNMP parameter list.
      tags:
      - tag: component
        value: battery
      valuemap:
        name: Vertiv battery test interval
    - uuid: 520c00cbf26840e5832a4283e3c2c542
      name: 'UPS: Input power total (calculated)'
      type: CALCULATED
      key: vertiv.input.power.total
      delay: 1m
      history: 90d
      value_type: FLOAT
      units: W
      params: last(//vertiv.input.power.l1)+last(//vertiv.input.power.l2)+last(//vertiv.input.power.l3)
      description: Calculated as the sum of the three Vertiv input phase-power items. The result inherits any vendor-specific scaling behavior of those source items and must be validated against the UPS UI.
      tags:
      - tag: component
        value: input
    discovery_rules:
    - uuid: 892ca15e79f943fca1a69373351353c9
      name: UPS input lines discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#UPSINPUTVOLTAGE},1.3.6.1.2.1.33.1.3.3.1.3]
      key: ups.input.lines.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      item_prototypes:
      - uuid: 3473e8fe048e4d729cacf9b2e01531a6
        name: 'UPS: Input line {#SNMPINDEX}: Frequency'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.2.{#SNMPINDEX}
        key: ups.input.frequency[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        value_type: FLOAT
        units: Hz
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
        tags:
        - tag: component
          value: input
      - uuid: 86b13312b27d4c969b5ddba890731f64
        name: 'UPS: Input line {#SNMPINDEX}: Voltage'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.3.{#SNMPINDEX}
        key: ups.input.voltage[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: V
        tags:
        - tag: component
          value: input
      - uuid: d02b734d419c49b0832f7c217ce71333
        name: 'UPS: Input line {#SNMPINDEX}: Current'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.4.{#SNMPINDEX}
        key: ups.input.current[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        value_type: FLOAT
        units: A
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
        tags:
        - tag: component
          value: input
      - uuid: ee3e9a74c6da4614b6c2255056d436c6
        name: 'UPS: Input line {#SNMPINDEX}: True power'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.3.3.1.5.{#SNMPINDEX}
        key: ups.input.power[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: W
        tags:
        - tag: component
          value: input
      lifetime_type: DELETE_AFTER
      enabled_lifetime: 1d
      description: Discovers UPS input lines/phases exposed by RFC1628 UPS-MIB.
    - uuid: d31c34932938414ba1b078d32f0deeca
      name: UPS output lines discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#UPSOUTPUTVOLTAGE},1.3.6.1.2.1.33.1.4.4.1.2]
      key: ups.output.lines.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      item_prototypes:
      - uuid: 183e5b6c30524472a5de53980c14679b
        name: 'UPS: Output line {#SNMPINDEX}: Voltage'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.2.{#SNMPINDEX}
        key: ups.output.voltage[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: V
        tags:
        - tag: component
          value: output
      - uuid: af101cd684f544d2888d1d2cc90b37ef
        name: 'UPS: Output line {#SNMPINDEX}: Current'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.3.{#SNMPINDEX}
        key: ups.output.current[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        value_type: FLOAT
        units: A
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
        tags:
        - tag: component
          value: output
      - uuid: c47c0f80ce3449a18a1fd273619c259c
        name: 'UPS: Output line {#SNMPINDEX}: Power'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.4.{#SNMPINDEX}
        key: ups.output.power[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: W
        tags:
        - tag: component
          value: output
      - uuid: a1aae8428cc344b397c0944b6f79b948
        name: 'UPS: Output line {#SNMPINDEX}: Load'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.33.1.4.4.1.5.{#SNMPINDEX}
        key: ups.output.load[{#SNMPINDEX}]
        delay: 1m
        history: 90d
        units: '%'
        tags:
        - tag: component
          value: output
        trigger_prototypes:
        - uuid: 3ed3a4a8a4a840109e3445ab1b13b6cc
          expression: last(/VERTIV by SNMP/ups.output.load[{#SNMPINDEX}])>={$UPS.LOAD.WARN} and last(/VERTIV by SNMP/ups.output.load[{#SNMPINDEX}])<{$UPS.LOAD.CRIT}
          name: UPS output line {#SNMPINDEX} load is high on {HOST.NAME}
          priority: WARNING
          opdata: 'Line {#SNMPINDEX} load: {ITEM.LASTVALUE1} %'
        - uuid: d450a36c1b9349a78f85bdf8af12e00b
          expression: last(/VERTIV by SNMP/ups.output.load[{#SNMPINDEX}])>={$UPS.LOAD.CRIT}
          name: UPS output line {#SNMPINDEX} load is critically high on {HOST.NAME}
          priority: HIGH
          opdata: 'Line {#SNMPINDEX} load: {ITEM.LASTVALUE1} %'
      lifetime_type: DELETE_AFTER
      enabled_lifetime: 1d
      description: Discovers UPS output lines/phases exposed by RFC1628 UPS-MIB.
    - uuid: 8c7176ea7cd74dcf9df4cb4dea616e81
      name: UPS bypass lines discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#UPSBYPASSVOLTAGE},1.3.6.1.2.1.33.1.5.3.1.2]
      key: ups.bypass.lines.discovery
