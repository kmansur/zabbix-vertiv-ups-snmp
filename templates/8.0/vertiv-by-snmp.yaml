    - uuid: d9ff15c330c6460cb28f23c233fbbaa3
      name: 'UPS: Automatic battery test'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.476.1.42.3.9.20.1.20.1.2.1.5803
      key: vertiv.battery.autotest
      delay: 1h
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - '// VERTIV_ENUM_NORMALIZER

          var s = String(value).trim();

          if (/^-?\d+$/.test(s)) { return parseInt(s, 10); }

          var p = s.match(/\((-?\d+)\)\s*$/);

          if (p) { return parseInt(p[1], 10); }

          var k = s.toLowerCase().replace(/\s+/g, '' '');

          var map = {"disabled":0,"enabled":1};

          if (map[k] !== undefined) { return map[k]; }

          throw ''Unsupported Vertiv enum value for vertiv.battery.autotest: '' + value;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: battery
      valuemap:
        name: Vertiv enabled/disabled
