        expression: last(/VERTIV by SNMP/vertiv.system.status)=8
        name: UPS has a warning on {HOST.NAME}
        priority: WARNING
        opdata: 'Status: {ITEM.LASTVALUE1}'
      - uuid: 804bd8bc5296432398ba117c5883cebe
