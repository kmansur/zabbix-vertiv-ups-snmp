      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.476.1.42.3.9.20.1.20.1.2.1.4123
      key: vertiv.system.status
      delay: 30s
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - '// VERTIV_ENUM_NORMALIZER

          var s = String(value).trim();

          if (/^-?\d+$/.test(s)) { return parseInt(s, 10); }

          var p = s.match(/\((-?\d+)\)\s*$/);

          if (p) { return parseInt(p[1], 10); }

          var k = s.toLowerCase().replace(/\s+/g, '' '');

          var map = {"abnormal operation":32,"normal operation":1,"normal with alarm":16,"normal with warning":8,"startup":2};

          if (map[k] !== undefined) { return map[k]; }

          throw ''Unsupported Vertiv enum value for vertiv.system.status: '' + value;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      tags:
      - tag: component
        value: status
      valuemap:
        name: Vertiv system status
      triggers:
