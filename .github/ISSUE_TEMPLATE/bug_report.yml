name: Bug report / Relato de bug
description: Report a template, documentation or compatibility problem. / Relate um problema de template, documentação ou compatibilidade.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials and sensitive network information.
        Obrigado por relatar o problema. Remova credenciais e informações sensíveis de rede.

  - type: input
    id: zabbix
    attributes:
      label: Zabbix version / Versão do Zabbix
      placeholder: "7.0.x or 8.0 beta/RC build"
    validations:
      required: true

  - type: input
    id: ups
    attributes:
      label: UPS model / Modelo do nobreak
      placeholder: "Vertiv/Liebert model"
    validations:
      required: true

  - type: input
    id: card
    attributes:
      label: Management card and firmware / Placa de gerenciamento e firmware
      placeholder: "Model + firmware"
    validations:
      required: false

  - type: dropdown
    id: snmp
    attributes:
      label: SNMP version / Versão SNMP
      options:
        - SNMPv3
        - SNMPv2c
        - SNMPv1
        - Unknown / Desconhecida
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description / Descrição do problema
      description: What happened and what did you expect? / O que ocorreu e o que era esperado?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: SNMP evidence / Evidências SNMP
      description: Include sanitized snmpget/snmpwalk output when relevant. / Inclua saída sanitizada de snmpget/snmpwalk quando relevante.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Zabbix error or unsupported item / Erro do Zabbix ou item unsupported
      render: text
    validations:
      required: false
