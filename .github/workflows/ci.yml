name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q tools tests

      - name: Ruff lint
        run: ruff check tools tests

      - name: Ruff format check
        run: ruff format --check tools tests

      - name: Run tests
        run: pytest -q

      - name: Validate versioned Zabbix templates
        run: python tools/validate_templates.py

      - name: Validate bilingual documentation parity
        run: python tools/validate_docs.py
