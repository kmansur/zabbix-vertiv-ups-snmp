name: Bootstrap release v1.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 1.1.0
      RELEASE_TAG: v1.1.0
      RELEASE_TARGET: 76b82eebfc03c84cd0444a65d72eab9bad89cd13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate release content
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "${RELEASE_VERSION}"
          python -m compileall -q tools tests
          ruff check tools tests
          ruff format --check tools tests
          pytest -q
          python tools/validate_templates.py
          python tools/validate_docs.py

      - name: Build release archive and assets
        shell: bash
        run: |
          set -euo pipefail
          package="zabbix-vertiv-ups-snmp-${RELEASE_VERSION}"
          mkdir -p "dist/${package}"
          cp -r templates docs "dist/${package}/"
          cp README.md README.pt-BR.md \
             CHANGELOG.md CHANGELOG.pt-BR.md \
             CONTRIBUTING.md CONTRIBUTING.pt-BR.md \
             SECURITY.md SECURITY.pt-BR.md \
             LICENSE NOTICE.md NOTICE.pt-BR.md VERSION \
             "dist/${package}/"
          cp templates/zabbix-7.0/vertiv-by-snmp.yaml dist/vertiv-by-snmp-zabbix-7.0.yaml
          cp templates/zabbix-8.0/vertiv-by-snmp.yaml dist/vertiv-by-snmp-zabbix-8.0.yaml
          cd dist
          zip -r "${package}.zip" "${package}"
          sha256sum vertiv-by-snmp-zabbix-7.0.yaml vertiv-by-snmp-zabbix-8.0.yaml "${package}.zip" > SHA256SUMS

      - name: Prepare bilingual release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # VERTIV by SNMP 1.1.0

          Phase 1 electrical-summary release focused on deterministic, dashboard-ready UPS data while preserving the existing RFC 1628 low-level discovery.

          - Adds fixed input L-N/L-L voltages, currents, power factor and real power by phase.
          - Adds fixed output L-N/L-L voltages, currents, power factor, load, real power and apparent power by phase.
          - Adds fixed bypass L-N/L-L voltages and standardized output frequency.
          - Adds battery cabinet type and automatic battery-test interval metadata.
          - Adds calculated total input power and two electrical graphs.
          - Keeps all existing LLD rules for portability and automatic line discovery.
          - Does not guess scaling for Vertiv private SNMP objects; values must be validated against the UPS LCD/web interface.
          - Does not fabricate states/triggers for the private `.2.100.*` condition objects because the supplied files do not define their polling-state encoding.
          - Read-only monitoring remains enforced: no reboot, shutdown or SNMP write operations.
          - Documentation and changelog are maintained in English and Brazilian Portuguese.

          ## Português (Brasil)

          Release da Fase 1 do resumo elétrico, focada em dados determinísticos e preparados para dashboards, preservando a descoberta de baixo nível da RFC 1628.

          - Adiciona tensões fixas L-N/L-L de entrada, correntes, fator de potência e potência real por fase.
          - Adiciona tensões fixas L-N/L-L de saída, correntes, fator de potência, carga, potência real e potência aparente por fase.
          - Adiciona tensões fixas L-N/L-L do bypass e frequência de saída padronizada.
          - Adiciona tipo de gabinete de bateria e intervalo do autoteste automático.
          - Adiciona potência total de entrada calculada e dois gráficos elétricos.
          - Mantém todas as regras LLD existentes para portabilidade e descoberta automática das linhas.
          - Não presume escalas para objetos SNMP privados da Vertiv; os valores devem ser comparados com o LCD/interface web do nobreak.
          - Não inventa estados/triggers para os objetos privados de condição `.2.100.*`, pois os arquivos fornecidos não definem a codificação do estado retornado por polling.
          - O monitoramento continua somente leitura, sem reboot, shutdown ou operações SNMP de escrita.
          - Documentação e changelog mantidos em inglês e português do Brasil.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            "dist/zabbix-vertiv-ups-snmp-${RELEASE_VERSION}.zip" \
            "dist/vertiv-by-snmp-zabbix-7.0.yaml#VERTIV by SNMP - Zabbix 7.0" \
            "dist/vertiv-by-snmp-zabbix-8.0.yaml#VERTIV by SNMP - Zabbix 8.0 preview" \
            "dist/SHA256SUMS" \
            --target "${RELEASE_TARGET}" \
            --title "VERTIV by SNMP ${RELEASE_TAG}" \
            --notes-file release-notes.md
