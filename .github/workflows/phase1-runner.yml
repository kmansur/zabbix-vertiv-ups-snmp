name: Apply VERTIV by SNMP 1.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Restore upgrade script from bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          source = Path('.github/workflows/phase1-upgrade.yml').read_text()
          start = "cat > /tmp/phase1.b64 <<'PAYLOAD'\n"
          if start not in source:
              raise SystemExit('phase1 payload start marker not found')
          payload = source.split(start, 1)[1].split('\n          PAYLOAD', 1)[0]
          encoded = ''.join(line.strip() for line in payload.splitlines())
          Path('tools/phase1_upgrade.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY

      - name: Apply phase-1 upgrade
        run: python tools/phase1_upgrade.py

      - name: Format and validate repository
        shell: bash
        run: |
          set -euo pipefail
          ruff format tools tests
          python -m compileall -q tools tests
          ruff check tools tests
          ruff format --check tools tests
          pytest -q
          python tools/validate_templates.py
          python tools/validate_docs.py

      - name: Commit v1.1.0 project files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/phase1_upgrade.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION \
            templates \
            README.md README.pt-BR.md \
            CHANGELOG.md CHANGELOG.pt-BR.md \
            docs \
            tools/validate_templates.py tools/validate_docs.py \
            tests
          if git diff --cached --quiet; then
            echo 'No project changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add electrical summary metrics for v1.1.0'
          git push origin HEAD:main
