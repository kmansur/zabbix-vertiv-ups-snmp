name: Fix 1.4.1 dashboard field issues

on:
  push:
    branches:
      - fix/1.4.1-dashboard-field
    paths:
      - .github/apply_141.py
      - .github/workflows/fix-141.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/1.4.1-dashboard-field
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply 1.4.1 corrections
        run: python .github/apply_141.py

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          ruff format tools tests
          python -m compileall -q tools tests
          ruff check tools tests
          ruff format --check tools tests
          pytest -q
          python tools/validate_templates.py
          python tools/validate_docs.py
          python tools/generate_synoptic_map.py --host UPS-TEST --output /tmp/vertiv-ups-map.yaml

      - name: Remove temporary automation files
        run: rm -f .github/apply_141.py .github/workflows/fix-141.yml

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refine field dashboard graphs and runtime presentation'
          git push origin HEAD:fix/1.4.1-dashboard-field
