name: Preview dashboard status cards fix

on:
  push:
    branches:
      - preview/dashboard-status-cards-final
    paths:
      - .github/preview_dashboard_fix2.py
      - .github/workflows/preview-dashboard-fix2.yml

permissions:
  contents: write

jobs:
  preview-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6
        with:
          ref: preview/dashboard-status-cards-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply preview fix
        run: python .github/preview_dashboard_fix2.py

      - name: Validate preview fix
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .github/preview_dashboard_fix2.py tools tests
          python .github/preview_dashboard_fix2.py
          python tools/validate_docs.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for version in ('7.0', '8.0'):
              data = yaml.safe_load(Path(f'templates/{version}/vertiv-by-snmp.yaml').read_text(encoding='utf-8'))
              template = data['zabbix_export']['templates'][0]
              assert template['vendor']['version'] == '1.3-3'
              dashboard = next(d for d in template['dashboards'] if d['name'] == 'VERTIV UPS Overview')
              widgets = [w for p in dashboard['pages'] for w in p['widgets'] if w.get('type') == 'item']
              by_key = {}
              for widget in widgets:
                  key = next(
                      f['value']['key']
                      for f in widget['fields']
                      if f.get('type') == 'ITEM' and f.get('name') == 'itemid.0'
                  )
                  by_key[key] = widget
              for key in ('vertiv.system.status', 'ups.output.source', 'ups.battery.status', 'vertiv.shutdown.reason', 'vertiv.eco.status', 'vertiv.battery.test.result'):
                  fields = {f['name']: f for f in by_key[key]['fields']}
                  assert 'description' not in fields
                  assert fields['show.0']['value'] == '2'
                  assert fields['decimal_places']['value'] == '0'
                  assert 'bg_color' in fields
              assert by_key['vertiv.system.status']['width'] == '16'
          PY

      - name: Commit preview fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/7.0/vertiv-by-snmp.yaml templates/8.0/vertiv-by-snmp.yaml docs/en/dashboard-status-preview.md docs/pt-BR/dashboard-status-preview.md
          if git diff --cached --quiet; then
            echo 'No preview fix changes to commit.'
            exit 0
          fi
          git commit -m 'preview: keep severity colors and restore readable status values'
          git push origin HEAD:preview/dashboard-status-cards-final
