      - name: Apply phase-1 upgrade
        run: python tools/phase1_upgrade.py

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools tests
          ruff check tools tests
          ruff format --check tools tests
          pytest -q
          python tools/validate_templates.py
          python tools/validate_docs.py

      - name: Commit v1.1.0 and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/phase1_upgrade.py .github/workflows/phase1-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add electrical summary metrics for v1.1.0'
          git push origin HEAD:main

      - name: Tag v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.0 >/dev/null 2>&1; then
            echo 'Tag v1.1.0 already exists.'
            exit 0
          fi
          git tag -a v1.1.0 -m 'VERTIV by SNMP v1.1.0'
          git push origin v1.1.0
