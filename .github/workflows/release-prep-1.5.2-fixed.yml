name: One-time v1.5.2 release preparation fixed

on:
  push:
    branches:
      - release/1.5.2

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.5.2

      - name: Apply release preparation
        run: python tools/release_prep_152.py

      - name: Escape apostrophes in YAML description
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in (Path('templates/7.0/vertiv-by-snmp.yaml'), Path('templates/8.0/vertiv-by-snmp.yaml')):
              text = path.read_text(encoding='utf-8')
              text = text.replace("original author's permission", "original author''s permission")
              text = text.replace("template author's GPLv3 authorization", "template author''s GPLv3 authorization")
              path.write_text(text, encoding='utf-8')
          PY

      - name: Align documentation release references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          additions = {
              'docs/en/README.md': '\n## Current release tracking\n\nRepository candidate: **1.5.2**. Latest stable release: **1.5.2**. Release 1.5.2 is a licensing/attribution and metadata patch; monitoring semantics remain unchanged from 1.5.1.\n',
              'docs/pt-BR/README.md': '\n## Acompanhamento da release atual\n\nCandidata atual do repositório: **1.5.2**. Última release estável: **1.5.2**. A 1.5.2 é um patch de licenciamento/atribuição e metadados; a semântica de monitoramento permanece igual à 1.5.1.\n',
              'docs/en/versioning.md': '\n## Current release markers\n\nFor release **1.5.2**, both the repository candidate and latest stable release are **1.5.2**. The Zabbix template metadata is `vendor.version: 1.5-2`.\n',
              'docs/pt-BR/versioning.md': '\n## Marcadores da release atual\n\nPara a release **1.5.2**, tanto a candidata atual do repositório quanto a última release estável são **1.5.2**. Os metadados do template Zabbix utilizam `vendor.version: 1.5-2`.\n',
              'docs/en/homologation-1.5.0.md': '\n## Later release context\n\nThis document remains the field-validation record for monitoring release 1.5.0. The current repository candidate is **1.5.2** and the latest stable release is **1.5.2**; release 1.5.2 changes licensing/attribution and metadata without changing the monitoring semantics validated here.\n',
              'docs/pt-BR/homologation-1.5.0.md': '\n## Contexto das releases posteriores\n\nEste documento permanece como registro de validação em campo da release de monitoramento 1.5.0. A candidata atual do repositório é **1.5.2** e a última release estável é **1.5.2**; a release 1.5.2 altera licenciamento/atribuição e metadados sem modificar a semântica de monitoramento validada aqui.\n',
          }
          for name, block in additions.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if '1.5.2' not in text:
                  p.write_text(text.rstrip() + '\n' + block, encoding='utf-8')
          PY

      - name: Validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'License: MIT' templates/; then
            echo 'Stale MIT template description remains.' >&2
            exit 1
          fi
          python -m pip install -r requirements-dev.txt
          python tools/validate_templates.py
          python tools/validate_docs.py
          python tools/validate_production.py
          pytest -q

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-prep-1.5.2.yml
          rm -f .github/workflows/release-prep-1.5.2-fixed.yml
          rm -f tools/release_prep_152.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: prepare v1.5.2 licensing patch release'
          git push origin HEAD:release/1.5.2
