name: Finalize v1.5.3 documentation
on:
  push:
    paths:
      - .github/workflows/finalize-1.5.3-docs.yml
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/1.5.3-field-validation
      - name: Update required version documentation
        shell: python
        run: |
          from pathlib import Path
          def sub(path, pairs):
              p=Path(path); s=p.read_text()
              for old,new in pairs: s=s.replace(old,new)
              p.write_text(s)
          for path in ['CHANGELOG.md','CHANGELOG.pt-BR.md']:
              sub(path,[('## [Unreleased]\n','## [Unreleased]\n\n## [1.5.3] - 2026-09-14\n')])
          sub('docs/en/README.md',[
            ('Current repository version: **1.5.1**.','Current repository version: **1.5.3**.'),
            ('Latest stable release: **1.5.1**.','Latest stable release: **1.5.2**.'),
            ('Repository candidate: **1.5.2**. Latest stable release: **1.5.2**.','Repository candidate: **1.5.3**. Latest stable release: **1.5.2**.')])
          sub('docs/pt-BR/README.md',[
            ('Versão atual do repositório: **1.5.1**.','Versão atual do repositório: **1.5.3**.'),
            ('Última versão estável: **1.5.1**.','Última versão estável: **1.5.2**.'),
            ('Candidata atual do repositório: **1.5.2**. Última release estável: **1.5.2**.','Candidata atual do repositório: **1.5.3**. Última release estável: **1.5.2**.')])
          for path in ['docs/en/versioning.md','docs/pt-BR/versioning.md']:
              p=Path(path); s=p.read_text().replace('1.5.1','1.5.3'); p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md CHANGELOG.pt-BR.md docs/en/README.md docs/pt-BR/README.md docs/en/versioning.md docs/pt-BR/versioning.md
          git commit -m "docs: complete v1.5.3 version references"
          git push origin HEAD:maintenance/1.5.3-field-validation
