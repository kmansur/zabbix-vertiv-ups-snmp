name: Run one-time GPLv3 licensing migration

on:
  push:
    branches:
      - licensing/gplv3-attribution

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'ci: run licensing migration' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: licensing/gplv3-attribution

      - name: Extract and run migration body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/license-migration.yml').read_text(encoding='utf-8')
          start = src.index('      - name: Apply licensing and attribution updates')
          block = src[start:]
          run_start = block.index('        run: |\n') + len('        run: |\n')
          run_end = block.index('\n      - name: Commit migration')
          script = block[run_start:run_end]
          lines = script.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/license-migration.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/license-migration.sh

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/license-migration.yml .github/workflows/license-migration-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: align licensing and attribution with GPLv3 authorization'
          git push origin HEAD:licensing/gplv3-attribution
