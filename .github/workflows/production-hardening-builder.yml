name: Production hardening builder

on:
  push:
    branches:
      - production/1.5.0-hardening

permissions:
  contents: write

jobs:
  build-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Make builder deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_production_hardening.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import json\nimport re\nimport uuid\n", "import hashlib\nimport json\nimport re\nimport uuid\n")
          text = text.replace(
              "def new_uuid() -> str:\n    return uuid.uuid4().hex\n",
              "_uuid_counter = 0\n\n"
              "def reset_uuid_counter() -> None:\n"
              "    global _uuid_counter\n"
              "    _uuid_counter = 0\n\n"
              "def new_uuid() -> str:\n"
              "    global _uuid_counter\n"
              "    _uuid_counter += 1\n"
              "    seed = hashlib.sha256(f'vertiv-1.5.0-{_uuid_counter}'.encode()).digest()[:16]\n"
              "    return uuid.UUID(bytes=seed, version=4).hex\n",
          )
          text = text.replace(
              "def transform_template(path: Path) -> None:\n    data = yaml.safe_load(path.read_text(encoding=\"utf-8\"))\n",
              "def transform_template(path: Path) -> None:\n    reset_uuid_counter()\n    data = yaml.safe_load(path.read_text(encoding=\"utf-8\"))\n",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply production hardening
        run: python tools/apply_production_hardening.py

      - name: Normalize generated template semantics
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          for version in ("7.0", "8.0"):
              path = Path("templates") / version / "vertiv-by-snmp.yaml"
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              template = data["zabbix_export"]["templates"][0]
              desc = str(template.get("description", ""))
              desc = re.sub(r"\n\nExport target: Zabbix (?:7\.0|8\.0)\.", "", desc).rstrip()
              template["description"] = desc + f"\n\nExport target: Zabbix {version}."
              for rule in template.get("discovery_rules", []):
                  if rule.get("key") == "ups.alarm.discovery":
                      rule["enabled_lifetime"] = "1h"
              class Dumper(yaml.SafeDumper):
                  def ignore_aliases(self, data):
                      return True
              rendered = yaml.dump(data, Dumper=Dumper, sort_keys=False, allow_unicode=True, width=1000)
              header = "# SPDX-License-Identifier: MIT\n# Copyright (C) 2026 Karim Mansur / Net Tech\n# See NOTICE.md for attribution to the original Vertiv template reference.\n"
              path.write_text(header + rendered, encoding="utf-8")
          PY

      - name: Update versioning guides for candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/en/versioning.md"): [
                  ("Current version:\n\n```text\n1.4.1\n```", "Current candidate version:\n\n```text\n1.5.0\n```\n\nStable release remains **1.4.1** until field homologation is completed."),
                  ("For example, project version `1.4.1` is exported as `vendor.version: 1.4-1`.", "For example, candidate project version `1.5.0` is exported as `vendor.version: 1.5-0`."),
              ],
              Path("docs/pt-BR/versioning.md"): [
                  ("Versão atual:\n\n```text\n1.4.1\n```", "Versão candidata atual:\n\n```text\n1.5.0\n```\n\nA release estável permanece **1.4.1** até a conclusão da homologação em campo."),
                  ("Por exemplo, a versão do projeto `1.4.1` é exportada como `vendor.version: 1.4-1`.", "Por exemplo, a versão candidata `1.5.0` é exportada como `vendor.version: 1.5-0`."),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              if "1.5.0" not in text:
                  text += "\n\nCandidate version: 1.5.0\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Keep permanent workflows for connector-managed update
        shell: bash
        run: |
          git checkout -- .github/workflows/ci.yml .github/workflows/release.yml

      - name: Normalize generated Python
        shell: bash
        run: |
          chmod +x tools/apply_production_hardening.py tools/zabbix_api_import_test.py
          ruff check --fix --unsafe-fixes tools tests
          ruff format tools tests

      - name: Compile Python sources
        run: python -m compileall -q tools tests

      - name: Ruff lint
        run: ruff check tools tests

      - name: Ruff format check
        run: ruff format --check tools tests

      - name: Run tests
        run: pytest -q

      - name: Validate versioned templates
        run: python tools/validate_templates.py

      - name: Validate bilingual documentation
        run: python tools/validate_docs.py

      - name: Validate production readiness
        run: python tools/validate_production.py

      - name: Start disposable Zabbix 7.0 stack
        shell: bash
        run: |
          set -euo pipefail
          docker network create zabbix-hardening
          docker run -d --name zabbix-db --network zabbix-hardening \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            postgres:16-alpine
          for i in $(seq 1 60); do
            if docker exec zabbix-db pg_isready -U zabbix -d zabbix >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec zabbix-db pg_isready -U zabbix -d zabbix

          docker run -d --name zabbix-server --network zabbix-hardening \
            -e DB_SERVER_HOST=zabbix-db \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            zabbix/zabbix-server-pgsql:alpine-7.0-latest

          docker run -d --name zabbix-web --network zabbix-hardening -p 8080:8080 \
            -e DB_SERVER_HOST=zabbix-db \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e ZBX_SERVER_HOST=zabbix-server \
            -e ZBX_SERVER_NAME="Vertiv hardening validation" \
            zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest

      - name: Import template through Zabbix API
        run: python tools/zabbix_api_import_test.py --template templates/7.0/vertiv-by-snmp.yaml --wait 300

      - name: Container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a || true
          docker logs zabbix-db || true
          docker logs zabbix-server || true
          docker logs zabbix-web || true

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: production hardening for v1.5.0 [hardening-generated]"
          git push origin HEAD:production/1.5.0-hardening
