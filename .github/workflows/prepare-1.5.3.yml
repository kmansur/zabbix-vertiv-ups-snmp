name: Prepare v1.5.3 field-validation update

on:
  push:
    branches: [maintenance/1.5.3-field-validation]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/1.5.3-field-validation

      - name: Apply maintenance changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def sub(path, pattern, repl, count=1, flags=0, required=True):
              s = read(path)
              n = 0
              s2, n = re.subn(pattern, repl, s, count=count, flags=flags)
              if required and n == 0:
                  raise SystemExit(f'pattern not found in {path}: {pattern}')
              write(path, s2)

          write('VERSION', '1.5.3\n')

          for path in ['templates/7.0/vertiv-by-snmp.yaml', 'templates/8.0/vertiv-by-snmp.yaml']:
              sub(path, r'(^      version: )1\.5-2$', r'\g<1>1.5-3', flags=re.M)
              sub(path, r'(      Version 1\.5\.2 aligns repository and template licensing/attribution.*?unchanged from 1\.5\.1\.\n)', r"\1\n\n      Version 1.5.3 reduces RFC1628 active-alarm discovery from 1 minute to 30 seconds after field validation showed that a real 30-second UPS alarm can occur entirely between 1-minute discovery cycles. Aggregate alarm/status polling remains unchanged.\n", flags=re.S)
              sub(path, r'(      key: ups\.alarm\.discovery\n      delay: )1m', r'\g<1>30s')

          # README status/candidate metadata. Stable stays 1.5.2 until promotion.
          sub('README.md', r'- \*\*Current repository version:\*\* `1\.5\.2`', '- **Current repository version:** `1.5.3`')
          sub('README.md', r'- \*\*1\.5\.2 scope:\*\*.*', '- **1.5.3 candidate scope:** field-validation maintenance; active-alarm LLD cadence reduced from 1m to 30s to improve capture of transient RFC1628 alarm rows')
          sub('README.md', r'Release `1\.5\.1` added the optional global-dashboard generator.*?`STABLE_VERSION` is `1\.5\.2` for the promoted stable release\.', "Release `1.5.1` added the optional global-dashboard generator and its bilingual documentation/tests. Release `1.5.2` regularizes repository/template licensing and attribution under GPLv3 with the original template author's permission. Repository candidate `1.5.3` applies a field-driven alarm-discovery cadence improvement while `STABLE_VERSION` remains `1.5.2` until promotion.", flags=re.S)
          sub('README.md', r'\| 7\.0 \| `templates/7\.0/vertiv-by-snmp\.yaml` \|.*\|', '| 7.0 | `templates/7.0/vertiv-by-snmp.yaml` | 1.5.3 candidate; field-driven 30s active-alarm discovery, with 1.5.2 remaining stable until promotion |')

          sub('README.pt-BR.md', r'- \*\*Versão atual do repositório:\*\* `1\.5\.2`', '- **Versão atual do repositório:** `1.5.3`')
          sub('README.pt-BR.md', r'- \*\*Escopo da 1\.5\.2:\*\*.*', '- **Escopo da candidata 1.5.3:** manutenção orientada pela validação em campo; a LLD de alarmes ativos passa de 1m para 30s para melhorar a captura de linhas transitórias RFC1628')
          sub('README.pt-BR.md', r'A release `1\.5\.1` adicionou o gerador opcional de dashboard global.*?O `STABLE_VERSION` é `1\.5\.2` para a release estável promovida\.', 'A release `1.5.1` adicionou o gerador opcional de dashboard global e sua documentação/testes bilíngues. A release `1.5.2` regulariza o licenciamento e a atribuição do repositório/template sob GPLv3 com autorização do autor do template original. A candidata `1.5.3` aplica uma melhoria de cadência de descoberta de alarmes baseada em evidência de campo, enquanto o `STABLE_VERSION` permanece `1.5.2` até a promoção.', flags=re.S)
          sub('README.pt-BR.md', r'\| 7\.0 \| `templates/7\.0/vertiv-by-snmp\.yaml` \|.*\|', '| 7.0 | `templates/7.0/vertiv-by-snmp.yaml` | Candidata 1.5.3; descoberta de alarmes ativos em 30s baseada em validação de campo, mantendo 1.5.2 como estável até a promoção |')

          en_ch = '''## [Unreleased]\n\n### Changed\n\n- Reduced RFC1628 `UPS active alarms discovery` cadence from 1 minute to 30 seconds in the Zabbix 7.0 and 8.0 exports. Field validation observed a real alarm that lasted only 30 seconds, which the aggregate 30-second alarm/status polling detected while a 1-minute LLD cycle could legitimately miss the transient `upsAlarmTable` row.\n- Kept lost-resource handling unchanged (`disable after 1h`, `delete after 1d`) so captured transient alarm rows remain available for diagnostics.\n\n### Field validation\n\n- Confirmed the dedicated SNMP heartbeat updates every minute and validated the complete five-minute `nodata()` PROBLEM/recovery cycle through a controlled UDP/161 interruption.\n- Confirmed no currently enabled default item is in the Zabbix `Not supported` state on the reference ITA-20kVA / IS-UNITY-DP firmware combination.\n- Recorded SNMPv2c/UDP 161 direct-server monitoring, reviewed all three host-dashboard pages, and confirmed real historical on-battery, warning, active-alarm, blackout and battery-discharge events with automatic recovery.\n- Battery-test result collection/value mapping is validated as `Passed`; a result-state transition remains pending natural observation. Management-agent reset-trigger evidence and individual transient `upsAlarmTable` LLD-row capture also remain pending/non-forced field observations.\n'''
          sub('CHANGELOG.md', r'## \[Unreleased\]\n', en_ch)

          pt_ch = '''## [Não lançado]\n\n### Alterado\n\n- Reduzida a cadência da `UPS active alarms discovery` RFC1628 de 1 minuto para 30 segundos nos exports Zabbix 7.0 e 8.0. A validação em campo observou um alarme real com duração de apenas 30 segundos, detectado pelo polling agregado de alarmes/status em 30s, enquanto um ciclo LLD de 1 minuto pode legitimamente perder a linha transitória da `upsAlarmTable`.\n- Mantido o tratamento de recursos perdidos (`desabilitar após 1h`, `excluir após 1d`) para preservar por tempo suficiente as linhas transitórias capturadas para diagnóstico.\n\n### Validação em campo\n\n- Confirmado o heartbeat SNMP dedicado a cada minuto e validado o ciclo completo PROBLEM/recuperação do `nodata()` de cinco minutos por interrupção controlada de UDP/161.\n- Confirmado que nenhum item padrão atualmente habilitado está em estado `Not supported` no conjunto de referência ITA-20kVA / IS-UNITY-DP.\n- Registrado SNMPv2c/UDP 161 monitorado diretamente pelo servidor, revisadas as três páginas do dashboard e confirmados eventos históricos reais de operação em bateria, warning, alarme ativo, blackout e descarga de bateria com recuperação automática.\n- A coleta/mapeamento do resultado do teste de bateria foi validada como `Passed`; uma transição de estado do teste permanece pendente de observação natural. A evidência do trigger de reset do agente e a captura individual de linha transitória da `upsAlarmTable` também permanecem como observações de campo pendentes e não forçadas.\n'''
          sub('CHANGELOG.pt-BR.md', r'## \[Não lançado\]\n', pt_ch)

          # Project status marker updates.
          sub('docs/en/project-status.md', r'\*\*Current repository version: 1\.5\.2\*\*', '**Current repository version: 1.5.3**')
          sub('docs/en/project-status.md', r'VERSION:\s+1\.5\.2\nSTABLE_VERSION:\s+1\.5\.2', 'VERSION:        1.5.3\nSTABLE_VERSION: 1.5.2')
          sub('docs/en/project-status.md', r'Version \*\*1\.5\.2\*\* is the current stable release\..*?unchanged from 1\.5\.1\.', 'Version **1.5.2** remains the current stable release. Repository candidate **1.5.3** incorporates field-validation evidence and reduces active-alarm LLD cadence from 1m to 30s after a real 30-second alarm demonstrated the observability gap between aggregate polling and the slower discovery cycle.', flags=re.S)
          sub('docs/en/project-status.md', r'\| Field compatibility record \| IN PROGRESS \|.*\|', '| Field compatibility record | IN PROGRESS | Heartbeat/nodata, dashboards, SNMP transport, enabled-item support and multiple real UPS events are validated; non-forced reset/test-transition/individual transient alarm-row observations remain open |')
          sub('docs/pt-BR/project-status.md', r'\*\*Versão atual do repositório: 1\.5\.2\*\*', '**Versão atual do repositório: 1.5.3**')
          sub('docs/pt-BR/project-status.md', r'VERSION:\s+1\.5\.2\nSTABLE_VERSION:\s+1\.5\.2', 'VERSION:        1.5.3\nSTABLE_VERSION: 1.5.2')

          # Homologation evidence: mark only directly completed checks.
          en='docs/en/homologation-1.5.0.md'
          for phrase in ['Confirm `ups.snmp.uptime` updates every minute', 'In a controlled window, interrupt SNMP reachability', 'Review all three dashboard pages', 'Record the SNMP version/security level', 'Confirm no unexpected unsupported items remain enabled by default']:
              sub(en, rf'^- \[ \] ({re.escape(phrase)}.*)$', r'- [x] \1', flags=re.M)
          sub(en, r'The current repository candidate is \*\*1\.5\.2\*\* and the latest stable release is \*\*1\.5\.2\*\*; release 1\.5\.2 changes licensing/attribution and metadata without changing the monitoring semantics validated here\.', 'The current repository candidate is **1.5.3** and the latest stable release remains **1.5.2**. Candidate 1.5.3 incorporates field-validation evidence and reduces active-alarm LLD cadence from 1m to 30s; it does not introduce write/control behavior.')
          evidence_en='''\n## Field-validation evidence collected on 2026-09-14\n\n- `ups.snmp.uptime` was observed updating at the configured 1-minute interval.\n- A controlled monitoring-side UDP/161 interruption produced the expected HIGH `UPS SNMP data unavailable` event after five minutes and recovered automatically after SNMP was restored.\n- Zabbix `Not supported` filtering returned no enabled/default items for the reference host.\n- Reference monitoring uses SNMPv2c on UDP/161 directly from the Zabbix Server; the community secret is intentionally excluded from this record.\n- Overview, Electrical and Battery & Environment dashboards rendered correctly in normal operation; collection gaps visible in history correspond to the intentional SNMP interruption.\n- Real events from 2026-09-12 confirmed active-alarm, on-battery, warning, blackout-counter and battery-discharge-counter triggers with automatic recovery. The active alarm lasted 30 seconds.\n- `upsAlarmsPresent` and normal empty `upsAlarmTable` behavior are validated. The 30-second real alarm was shorter than the current 1-minute LLD cadence, so individual alarm-row capture is not claimed; candidate 1.5.3 reduces that discovery cadence to 30 seconds.\n- `UPS: Battery test result` is collected and mapped as `Passed`; no state transition has yet been observed in retained history, so a transition remains pending natural observation.\n- A real management-card restart occurred previously and only restarted the management card, but the Zabbix uptime-reset trigger was not retained as direct evidence; the restart is not repeated solely for validation.\n\n'''
          sub(en, r'\n## Release decision\n', evidence_en+'## Release decision\n')

          pt='docs/pt-BR/homologation-1.5.0.md'
          for phrase in ['Confirmar que `ups.snmp.uptime` atualiza a cada minuto', 'Em janela controlada, interromper o acesso SNMP', 'Revisar as três páginas do dashboard', 'Registrar a versão/nível de segurança SNMP', 'Confirmar que nenhum item inesperadamente unsupported permanece habilitado por padrão']:
              sub(pt, rf'^- \[ \] ({re.escape(phrase)}.*)$', r'- [x] \1', flags=re.M)
          sub(pt, r'A candidata atual do repositório é \*\*1\.5\.2\*\* e a última release estável é \*\*1\.5\.2\*\*; a release 1\.5\.2 altera licenciamento/atribuição e metadados sem modificar a semântica de monitoramento validada aqui\.', 'A candidata atual do repositório é **1.5.3** e a última release estável permanece **1.5.2**. A candidata 1.5.3 incorpora evidência de validação em campo e reduz a cadência da LLD de alarmes ativos de 1m para 30s, sem introduzir operações de escrita/controle.')
          evidence_pt='''\n## Evidência de validação em campo coletada em 14/09/2026\n\n- `ups.snmp.uptime` foi observado atualizando no intervalo configurado de 1 minuto.\n- Uma interrupção controlada de UDP/161 no lado do monitoramento gerou o evento HIGH esperado `UPS SNMP data unavailable` após cinco minutos e recuperou automaticamente após a restauração do SNMP.\n- O filtro `Not supported` do Zabbix não retornou nenhum item padrão/habilitado no host de referência.\n- O ambiente de referência usa SNMPv2c em UDP/161 monitorado diretamente pelo Zabbix Server; o segredo da community é intencionalmente omitido deste registro.\n- Os dashboards Overview, Electrical e Battery & Environment renderizaram corretamente em operação normal; as lacunas no histórico correspondem à interrupção SNMP intencional.\n- Eventos reais de 12/09/2026 confirmaram triggers de alarme ativo, operação em bateria, warning, contador de blackout e contador de descarga da bateria com recuperação automática. O alarme ativo durou 30 segundos.\n- `upsAlarmsPresent` e o comportamento normal de `upsAlarmTable` vazia estão validados. Como o alarme real de 30 segundos foi menor que a cadência atual de 1 minuto da LLD, não é afirmada a captura individual da linha; a candidata 1.5.3 reduz a descoberta para 30 segundos.\n- `UPS: Battery test result` é coletado e mapeado como `Passed`; nenhuma transição de estado foi observada no histórico retido, portanto a transição permanece pendente de observação natural.\n- Um restart real da placa de gerenciamento ocorreu anteriormente e reiniciou somente a placa, mas o trigger de reset de uptime do Zabbix não ficou retido como evidência direta; o restart não será repetido apenas para validação.\n\n'''
          sub(pt, r'\n## Decisão de release\n', evidence_pt+'## Decisão de release\n')

          Path('.github/workflows/prepare-1.5.3.yml').unlink()

      - name: Commit prepared candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: prepare v1.5.3 field-validation maintenance candidate"
          git push origin HEAD:maintenance/1.5.3-field-validation
