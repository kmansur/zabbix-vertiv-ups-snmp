name: Bootstrap release v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 1.0.0
      RELEASE_TAG: v1.0.0
      RELEASE_TARGET: 0c35852cde062f93fbc6c6c03136c41756952b53

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate release content
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "${RELEASE_VERSION}"
          ruff check tools tests
          ruff format --check tools tests
          pytest -q
          python tools/validate_templates.py
          python tools/validate_docs.py

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          package="zabbix-vertiv-ups-snmp-${RELEASE_VERSION}"
          mkdir -p "dist/${package}"
          cp -r templates docs "dist/${package}/"
          cp README.md README.pt-BR.md \
             CHANGELOG.md CHANGELOG.pt-BR.md \
             CONTRIBUTING.md CONTRIBUTING.pt-BR.md \
             SECURITY.md SECURITY.pt-BR.md \
             LICENSE NOTICE.md NOTICE.pt-BR.md VERSION \
             "dist/${package}/"
          cd dist
          zip -r "${package}.zip" "${package}"

      - name: Prepare bilingual release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # VERTIV by SNMP 1.0.0

          Initial public release of the VERTIV by SNMP monitoring template.

          - Zabbix 7.0 template included.
          - Zabbix 8.0 compatibility preview included.
          - RFC 1628 UPS-MIB and Vertiv/Liebert enterprise OIDs.
          - Battery, input, output, bypass, status, environmental and power-quality monitoring.
          - LLD for input, output and bypass phases/lines.
          - Configurable trigger thresholds, value maps and graphs.
          - Read-only monitoring: no reboot, shutdown or other SNMP write operations.
          - Complete English and Brazilian Portuguese documentation.
          - Credit to the original Template Vertiv by Mihguel da Silva Santos Tavares de Araujo; see NOTICE.md for licensing and attribution details.

          ## Português (Brasil)

          Primeira versão pública do template de monitoramento VERTIV by SNMP.

          - Template para Zabbix 7.0 incluído.
          - Preview de compatibilidade com Zabbix 8.0 incluído.
          - UPS-MIB RFC 1628 e OIDs privados Vertiv/Liebert.
          - Monitoramento de bateria, entrada, saída, bypass, status, ambiente e qualidade de energia.
          - LLD para fases/linhas de entrada, saída e bypass.
          - Limites de triggers configuráveis, mapas de valores e gráficos.
          - Monitoramento somente leitura: sem reboot, shutdown ou outras operações SNMP de escrita.
          - Documentação completa em inglês e português do Brasil.
          - Crédito ao Template Vertiv original de Mihguel da Silva Santos Tavares de Araujo; consulte NOTICE.pt-BR.md para detalhes de licença e atribuição.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            "dist/zabbix-vertiv-ups-snmp-${RELEASE_VERSION}.zip" \
            "templates/zabbix-7.0/vertiv-by-snmp.yaml#VERTIV by SNMP - Zabbix 7.0" \
            "templates/zabbix-8.0/vertiv-by-snmp.yaml#VERTIV by SNMP - Zabbix 8.0 preview" \
            --target "${RELEASE_TARGET}" \
            --title "VERTIV by SNMP ${RELEASE_TAG}" \
            --notes-file release-notes.md
