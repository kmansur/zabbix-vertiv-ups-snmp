name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate tag and project version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(tr -d '\r\n' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "VERSION ($project_version) does not match tag ($tag_version)" >&2
            exit 1
          fi
          python tools/validate_templates.py
          python tools/validate_docs.py
          pytest -q

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          package="zabbix-vertiv-ups-snmp-${version}"
          mkdir -p "dist/${package}"
          cp -r templates docs tools "dist/${package}/"
          cp README.md README.pt-BR.md \
             CHANGELOG.md CHANGELOG.pt-BR.md \
             CONTRIBUTING.md CONTRIBUTING.pt-BR.md \
             SECURITY.md SECURITY.pt-BR.md \
             LICENSE NOTICE.md NOTICE.pt-BR.md VERSION requirements-dev.txt \
             "dist/${package}/"
          cp templates/7.0/vertiv-by-snmp.yaml "dist/vertiv-by-snmp-zabbix-7.0.yaml"
          cp templates/8.0/vertiv-by-snmp.yaml "dist/vertiv-by-snmp-zabbix-8.0.yaml"
          (cd dist && zip -r "${package}.zip" "${package}")
          (cd dist && sha256sum \
            vertiv-by-snmp-zabbix-7.0.yaml \
            vertiv-by-snmp-zabbix-8.0.yaml \
            "${package}.zip" > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/vertiv-by-snmp-zabbix-7.0.yaml" \
            "dist/vertiv-by-snmp-zabbix-8.0.yaml" \
            "dist/zabbix-vertiv-ups-snmp-${version}.zip" \
            "dist/SHA256SUMS" \
            --title "Vertiv by SNMP ${GITHUB_REF_NAME}" \
            --generate-notes
