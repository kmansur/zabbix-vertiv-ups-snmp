name: Field inventory sysName patch

on:
  push:
    branches:
      - homologation/inventory-sysname

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: homologation/inventory-sysname

      - name: Apply field inventory fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          template_paths = [
              root / 'templates/7.0/vertiv-by-snmp.yaml',
              root / 'templates/8.0/vertiv-by-snmp.yaml',
          ]

          sysname_block = """    - uuid: 87e44a559b2045ee9f16a9b51f78f247
                name: 'UPS: SNMP system name'
                type: SNMP_AGENT
                snmp_oid: 1.3.6.1.2.1.1.5.0
                key: ups.snmp.sysname
                delay: 1h
                history: 30d
                trends: '0'
                value_type: CHAR
                description: SNMPv2-MIB sysName. Preferred source for Zabbix inventory Name because some Vertiv UPS name objects return placeholder zero strings. This template performs read-only SNMP GET operations.
                preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                  - 1d
                tags:
                - tag: component
                  value: identification
                inventory_link: NAME
          """

          uptime_marker = "    - uuid: 5699f88221464fe08694b26b7c8cf6b1\n      name: 'UPS: SNMP agent uptime'\n"

          sysname_block = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in sysname_block.splitlines()
          ) + '\n'

          for path in template_paths:
              text = path.read_text(encoding='utf-8')
              start = text.index('      key: vertiv.system.name\n')
              end = text.index('\n    - uuid:', start)
              block = text[start:end]
              block = block.replace('      inventory_link: NAME', '')
              text = text[:start] + block + text[end:]

              if '      key: ups.snmp.sysname\n' not in text:
                  if uptime_marker not in text:
                      raise SystemExit(f'uptime insertion marker not found in {path}')
                  text = text.replace(uptime_marker, sysname_block + uptime_marker, 1)

              path.write_text(text, encoding='utf-8')

          validator = root / 'tools/validate_production.py'
          text = validator.read_text(encoding='utf-8')
          if '"ups.snmp.sysname",' not in text:
              text = text.replace(
                  '    "ups.snmp.uptime",\n',
                  '    "ups.snmp.uptime",\n    "ups.snmp.sysname",\n',
                  1,
              )
          text = text.replace(
              '        "vertiv.system.name": "NAME",\n',
              '        "ups.snmp.sysname": "NAME",\n',
              1,
          )
          guard = '''\n    if items.get("vertiv.system.name", {}).get("inventory_link"):\n        errors.append("private Vertiv system name must not populate inventory NAME")\n'''
          marker = '    # Safety: no UPS control branch or Vertiv reboot OID can appear anywhere.\n'
          if 'private Vertiv system name must not populate inventory NAME' not in text:
              text = text.replace(marker, guard + '\n' + marker, 1)
          validator.write_text(text, encoding='utf-8')

          pt = root / 'docs/pt-BR/compatibility.md'
          text = pt.read_text(encoding='utf-8')
          old = 'O ambiente de homologação usa **Zabbix Server 7.0.30**. Números de série não são publicados nesta matriz.'
          new = 'O ambiente de homologação usa **Zabbix Server 7.0.30**. O `sysName.0` retornou `nobreak-01`, enquanto os objetos de nome do UPS retornaram preenchimento de zeros; por isso o inventory `NAME` passa a usar `sysName.0` como fonte confiável. Números de série não são publicados nesta matriz.'
          if old in text:
              text = text.replace(old, new, 1)
          pt.write_text(text, encoding='utf-8')

          en = root / 'docs/en/compatibility.md'
          text = en.read_text(encoding='utf-8')
          old = 'The homologation environment runs **Zabbix Server 7.0.30**. Serial numbers are intentionally not published in this matrix.'
          new = 'The homologation environment runs **Zabbix Server 7.0.30**. `sysName.0` returned `nobreak-01`, while the UPS-specific name objects returned zero-filled placeholders; therefore inventory `NAME` now uses `sysName.0` as the reliable source. Serial numbers are intentionally not published in this matrix.'
          if old in text:
              text = text.replace(old, new, 1)
          en.write_text(text, encoding='utf-8')
          PY

      - name: Run focused validation
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          ruff format tools/validate_production.py
          ruff check tools tests
          ruff format --check tools tests
          pytest -q
          python tools/validate_templates.py
          python tools/validate_docs.py
          python tools/validate_production.py

      - name: Commit generated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/7.0/vertiv-by-snmp.yaml templates/8.0/vertiv-by-snmp.yaml tools/validate_production.py docs/pt-BR/compatibility.md docs/en/compatibility.md
          git commit -m "fix: use SNMP sysName for inventory name"
          git push origin HEAD:homologation/inventory-sysname
